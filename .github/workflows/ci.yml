name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handel
          POSTGRES_PASSWORD: handel
          POSTGRES_DB: handel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handel" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      HANDEL_ENV: test
      HANDEL_MODEL_MODE: replay  # CI never calls live model or speech APIs
      HANDEL_TEST_DATABASE_URL: postgresql+asyncpg://handel:handel@localhost:5432/handel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Architecture contracts (domain stays pure)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image (push and deploy arrive in P7)
        run: docker build -t handel:ci .
